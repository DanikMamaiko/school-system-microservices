server:
  port: 8085

spring:
  application:
    name: GRADEBOOK-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5433/studentdb
    driver-class-name: org.postgresql.Driver
    username: student
    password: student

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

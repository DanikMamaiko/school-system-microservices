server:
  port: 8086

spring:
  application:
    name: LIBRARY-SERVICE
  data:
    mongodb:
      uri: mongodb://localhost:27017/librarydb

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost


